# AuraFit event pipeline — `docker compose up --build` starts everything.
# Scale consumers:  docker compose up -d --scale consumer=2

x-pipeline-env: &pipeline-env
  KAFKA_BROKERS: kafka:29092
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  REDIS_URL: redis://redis:6379
  MONGO_URI: mongodb://mongo:27017/aurafit_pipeline
  CLOUDINARY_URL: ${CLOUDINARY_URL:-}

services:
  # ── Brokers & stores ──────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]            # host listener, used by loadtest/failure scripts
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]   # 15672 = management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── Application services ──────────────────────────────────────────────────
  consumer:
    build: ./pipeline
    command: ["node", "src/consumer/index.js"]
    environment: *pipeline-env
    restart: unless-stopped
    depends_on: &deps
      kafka: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }

  worker:
    build: ./pipeline
    command: ["node", "src/worker/index.js"]
    environment: *pipeline-env
    restart: unless-stopped
    depends_on: *deps

  api:
    build: ./backend
    ports: ["5000:5000"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/aurafit
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      PIPELINE_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
    depends_on:
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }

  # ── Observability ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    depends_on: [consumer, worker]

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]          # dashboard: http://localhost:3000 (anonymous admin, no login)
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  mongo-data:
