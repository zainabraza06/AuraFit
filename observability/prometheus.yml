global:
  scrape_interval: 5s

scrape_configs:
  # DNS A-record discovery returns every replica, so `--scale consumer=N` is picked up automatically.
  - job_name: consumer
    dns_sd_configs:
      - names: [consumer]
        type: A
        port: 9100
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
