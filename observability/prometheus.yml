global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # DNS A-record discovery returns every replica, so `--scale consumer=N` is picked up automatically.
  - job_name: consumer
    dns_sd_configs:
      - names: [consumer]
        type: A
        refresh_interval: 10s
        port: 9100
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        refresh_interval: 10s
        port: 9100

  # The API's /metrics is token-protected (METRICS_TOKEN). The token is read from a file so it
  # never sits in this config. For production, mount your own file at this path.
  - job_name: api
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/metrics_token
    dns_sd_configs:
      - names: [api]
        type: A
        refresh_interval: 10s
        port: 5000
