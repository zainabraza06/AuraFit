name: Weekly catalog refresh

# Re-scrapes every brand, marks sold-out products, inserts new ones, and embeds
# everything that is new or changed (Qwen3-Embedding, runs on the runner - no API key).
on:
  schedule:
    - cron: '0 22 * * 0'   # Sunday 22:00 UTC = Monday 03:00 in Pakistan
  workflow_dispatch:
    inputs:
      only_brands:
        description: 'Optional: limit the CLOTHING scrape to these brands, comma separated (e.g. "Khaadi,Maria B")'
        required: false
        default: ''

env:
  ONNXRUNTIME_NODE_INSTALL: skip   # CPU only: do not download the CUDA libraries during npm ci

# Never run two refreshes at once; let a running one finish instead of cancelling it half-way
concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Require the database secret
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          if [ -z "$MONGO_URI" ]; then
            echo "Add the MONGO_URI repository secret (Settings -> Secrets and variables -> Actions)" >&2
            exit 1
          fi

      - run: npm ci

      # Text model (~600 MB) + FashionCLIP image model (~150 MB): downloaded once, then restored from cache on later runs
      - uses: actions/cache@v4
        with:
          path: backend/.model-cache
          key: embedding-models-qwen3-0.6b-q8-fashionclip-0f99955-q8-v3

      - name: Refresh catalog (scrape, stock check, embed)
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SCRAPER_ONLY_BRANDS: ${{ github.event.inputs.only_brands }}
          SCRAPER_DELAY_MS: '3000'          # be gentler than local runs: retailers rate-limit CI IPs
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run refresh:catalog

      # Same code path the API uses, judged by predicate-based golden queries (backend/eval). Fails the run
      # if precision/recall/MRR/nDCG drop more than 0.05 below backend/eval/baseline.json, i.e. a refresh
      # or a code change made search worse. Baseline is updated by hand with: npm run eval:search -- --write-baseline
      - name: Search quality gate (golden queries)
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          npm run search:smoke
          npm run eval:search | tee eval-report.txt

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-eval-report
          path: backend/eval-report.txt
          if-no-files-found: ignore
