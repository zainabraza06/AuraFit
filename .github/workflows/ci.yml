name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [pipeline, backend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      # The pipeline contract test imports backend/events, so backend must be installed too
      - if: matrix.package == 'pipeline'
        run: npm ci --prefix ../backend
      - run: npm test

  build-images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: pipeline, context: pipeline }
          - { name: api, context: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR image names must be lowercase; this repo name is mixed-case
      - id: img
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # PRs only prove the image builds; main publishes it
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.img.outputs.repo }}/${{ matrix.name }}:latest,ghcr.io/${{ steps.img.outputs.repo }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: pipeline/package-lock.json }
      - run: npm ci
        working-directory: pipeline
      - run: npm ci --prefix backend
      - name: Start the stack
        run: docker compose up -d --build --scale consumer=2 kafka rabbitmq redis mongo consumer worker
      - name: Wait for consumers to join the group
        run: sleep 30
      - name: Load test
        run: npm run loadtest -- --products=5000
        working-directory: pipeline
      - name: Failure test (SIGKILL one consumer mid-run)
        run: npm run failuretest -- --products=10000 --mode=one
        working-directory: pipeline
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: pipeline-results, path: docs/results }
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 consumer worker kafka
      - run: docker compose down -v
        if: always()

  deploy:
    # Runs only on main, after tests, the image build and the crash test have passed.
    # Skipped (not failed) until the DEPLOY_HOST repository variable is set.
    needs: [build-images, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: img
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy compose files and observability config
        run: |
          SSH="ssh -i ~/.ssh/id_deploy ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}"
          $SSH "mkdir -p ~/aurafit"
          tar czf - docker-compose.yml docker-compose.prod.yml observability | $SSH "tar xzf - -C ~/aurafit"
      - name: Pull the images built for this commit and restart
        run: |
          ssh -i ~/.ssh/id_deploy ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} \
            "cd ~/aurafit && docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
             IMAGE_PREFIX=ghcr.io/${{ steps.img.outputs.repo }} TAG=${{ github.sha }} \
               docker compose -f docker-compose.yml -f docker-compose.prod.yml pull consumer worker api && \
             IMAGE_PREFIX=ghcr.io/${{ steps.img.outputs.repo }} TAG=${{ github.sha }} \
               docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --remove-orphans" \
            <<< "${{ secrets.GITHUB_TOKEN }}"
      - name: Smoke test the deployed API and metrics
        run: |
          for i in $(seq 1 30); do
            curl -fsS "http://${{ vars.DEPLOY_HOST }}:5000/api/health" && curl -fsS "http://${{ vars.DEPLOY_HOST }}:9090/-/ready" && exit 0
            sleep 5
          done
          echo "deployed stack did not become healthy" && exit 1
