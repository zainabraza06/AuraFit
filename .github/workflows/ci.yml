name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [pipeline, backend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      # The pipeline contract test imports backend/events, so backend must be installed too
      - if: matrix.package == 'pipeline'
        run: npm ci --prefix ../backend
      - run: npm test

  build-images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: pipeline, context: pipeline }
          - { name: api, context: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # PRs only prove the image builds; main publishes it
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest,ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: pipeline/package-lock.json }
      - run: npm ci
        working-directory: pipeline
      - run: npm ci --prefix backend
      - name: Start the stack
        run: docker compose up -d --build --scale consumer=2 kafka rabbitmq redis mongo consumer worker
      - name: Wait for consumers to join the group
        run: sleep 30
      - name: Load test
        run: npm run loadtest -- --products=5000
        working-directory: pipeline
      - name: Failure test (SIGKILL one consumer mid-run)
        run: npm run failuretest -- --products=10000 --mode=one
        working-directory: pipeline
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: pipeline-results, path: docs/results }
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 consumer worker kafka
      - run: docker compose down -v
        if: always()
